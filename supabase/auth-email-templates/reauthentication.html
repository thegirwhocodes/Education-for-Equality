<div style="margin:0;background:#f3f7f5;padding:32px 16px;font-family:Inter,Arial,sans-serif;color:#16342c;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dce9e3;border-radius:18px;overflow:hidden;">
    <tr>
      <td style="padding:30px 30px 18px;text-align:left;">
        <table role="presentation" cellspacing="0" cellpadding="0">
          <tr>
            <td style="width:48px;vertical-align:middle;">
              <img src="https://eduforequality.org/tree-icon.png" width="44" height="44" alt="Education for Equality" style="display:block;border-radius:10px;">
            </td>
            <td style="padding-left:12px;vertical-align:middle;">
              <div style="font-size:18px;font-weight:800;color:#064e3b;line-height:1.2;">Education for Equality</div>
              <div style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#6b7f77;margin-top:3px;">Verification code</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:8px 30px 28px;">
        <h1 style="margin:0;font-size:28px;line-height:1.18;color:#12372f;">Verify it is you</h1>
        <p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#41534d;">Use this code to continue in Education for Equality:</p>
        <p style="margin:22px 0 0;background:#eef8f3;border:1px solid #c9e7da;border-radius:14px;padding:18px 20px;text-align:center;font-size:32px;font-weight:900;letter-spacing:0.18em;color:#064e3b;">{{ .Token }}</p>
      </td>
    </tr>
    <tr>
      <td style="background:#f7fbf8;border-top:1px solid #e2eee8;padding:22px 30px;">
        <p style="margin:0;font-size:13px;line-height:1.6;color:#65756f;">This code expires soon. If you did not request this, you can ignore this email.</p>
      </td>
    </tr>
  </table>
</div>
